<div class="headerContainer">
  <div class="header">
    <a routerLink="/">Gummistövelbutiken</a>
  </div>
  <div class="menu">
    @if (this.productService.showAccessoires() === true) {
      <button (click)="this.productService.onClickShowRainboots()">Gummistövlar</button>
    } @else {
      <button (click)="this.productService.onClickShowAccessoires()">Accessoarer</button>
    }
    <a>Om oss</a>
    <button (click)="onClickShowCart()">Varukorg</button>
  </div>
  <div class="dropdown">
    <label>Stövelhöjd</label>
    <select>
      <option>Låg</option>
      <option>Mellan</option>
      <option>Hög</option>
    </select>
  </div>
</div>
