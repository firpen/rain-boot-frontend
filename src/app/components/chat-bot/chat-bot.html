<div class="chatbotContainer">
  <div class="chatHeader">Har du frågor?</div>
  <ul>
    @for (message of messageList(); track $index) {
      <li [class]="message.role">{{ message.content }}</li>
    }
  </ul>
  <form (ngSubmit)="onSubmit()">
    <input name="prompt" [(ngModel)]="prompt" placeholder="Skriv din fråga här" />
    <button type="submit">➤</button>
  </form>
</div>
