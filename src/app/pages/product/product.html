<div class="productContainer">
  <div class="productview">
    <div class="picture">
      <button class="arrow" (click)="this.productService.changePictureLeft()">‹</button>
      <img src="{{ product()!.pictures[this.productService.pictureNumber()].img }}" />
      <button class="arrow" (click)="this.productService.changePictureRight()">›</button>
    </div>
    <div class="info">
      <h1>{{ product()!.productName }}</h1>
      <p class="price">{{ product()!.price }} kr</p>
      @if (product(); as p) {
        @if ('size' in p) {
          <label>Storlek</label>
          <select [(ngModel)]="size">
            <option [ngValue]="p.size">{{ p.size }}</option>
          </select>
        }
      }
      <label>Antal</label>
      <select [(ngModel)]="quantity">
        <option [ngValue]="1">1</option>
        <option [ngValue]="2">2</option>
        <option [ngValue]="3">3</option>
        <option [ngValue]="4">4</option>
        <option [ngValue]="5">5</option>
      </select>
      <button class="addBtn" (click)="addToCart()">Lägg i varukorgen</button>
    </div>
  </div>
</div>
