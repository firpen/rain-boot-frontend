<app-header />
<router-outlet />
@if (this.cartService.showCart() === true) {
  <app-cart />
}
<div class="chatbotContainer">
  @if (chatBotService.showChatBot() === false) {
    <div class="questions">
      <label>Frågor?</label>
      <button (click)="chatBotService.onShowChatBot()">Fråga här</button>
    </div>
  } @else {
    <div class="chatbot">
      <button class="hideChatBotBtn" (click)="chatBotService.onHideChatBot()">X</button>
      <app-chat-bot />
    </div>
  }
</div>
<app-footer />
